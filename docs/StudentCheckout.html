<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ثبت‌نام و پرداخت · وایرفریم چکاوک یوگا</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f5f8b}a:hover{color:#174a6c}
.scr{width:390px;height:844px;box-sizing:border-box;background:#f3f4f5;font-family:Vazirmatn,Tahoma,sans-serif;color:#1d2125;direction:rtl;display:flex;flex-direction:column;overflow:hidden}
.top{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;background:#fff;border-bottom:1px solid #d4d7db}
.top h1{margin:0;font-size:17px;font-weight:700}
.body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #d4d7db;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 16px;border-radius:10px;background:#1d2125;color:#fff;text-decoration:none;font-weight:700;font-size:16px;border:0;font-family:inherit;cursor:pointer}
.btn:hover{color:#fff;background:#3a4047}
.btn2{display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:8px;background:#fff;color:#1d2125;text-decoration:none;font-size:14px;border:1px solid #9aa0a6;flex-shrink:0}
.btn2:hover{color:#1d2125;background:#eceef0}
.muted{color:#5b6167;font-size:13px;margin:0;line-height:1.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.f label{font-size:13px;color:#3c4043;font-weight:500}
.f input{height:46px;box-sizing:border-box;border:1px solid #b4b9bf;border-radius:8px;padding:0 12px;font-family:inherit;font-size:15px;background:#fff;width:100%}
.ph{background:#e4e6e9;border:1px dashed #8f959b;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4f555b;font-size:12px;flex-shrink:0}
</style>

<style>
html{background:#d9dcdf}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 0;box-sizing:border-box}
.wf-back{font-family:Vazirmatn,Tahoma,sans-serif;font-size:13px;color:#1d2125;direction:rtl}
.scr{border-radius:28px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
@media (max-width:480px){
  body{padding:0;justify-content:flex-start}
  .wf-back{display:none}
  .scr{width:100%!important;height:100vh!important;height:100dvh!important;border-radius:0;box-shadow:none}
}
</style>
</head>
<body>
<a class="wf-back" href="index.html">همه‌ی صفحه‌ها</a>
<div class="scr">
  <div class="top">
    <a href="StudentCoachPage.html" style="font-size: 14px; text-decoration: none">بازگشت</a>
    <h1>ثبت‌نام</h1>
    <span style="width: 44px"></span>
  </div>
  <div class="body">
    <div class="card" style="flex-direction: row; align-items: center">
      <div class="ph" style="width: 64px; height: 64px">کاور</div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">یوگای پایه — پاییز</span>
        <span class="muted">[نام مربی] · ۸ جلسه · شروع ۱ آبان</span>
      </div>
    </div>

    <div class="card">
      <div class="f"><label for="c-name">نام و نام خانوادگی</label><input id="c-name"></div>
      <div class="f"><label for="c-mob">شماره‌ی موبایل</label><input id="c-mob" placeholder="۰۹۱۲ ••• ••••" style="direction: ltr; text-align: right"></div>
      <p class="muted">برای ورود، کد تأیید پیامک می‌شود. رمز عبور لازم نیست.</p>
    </div>

    <div class="card">
      <div style="display: flex; gap: 8px; align-items: flex-end">
        <div class="f"><label for="c-off">کد تخفیف</label><input id="c-off"></div>
        <a class="btn2" href="StudentCheckout.html">اعمال</a>
      </div>
      <div class="row" style="border-top: 1px solid #e4e6e9; padding-top: 12px">
        <span style="font-size: 15px">مبلغ قابل پرداخت</span>
        <span style="font-size: 18px; font-weight: 700">[قیمت ترم] تومان</span>
      </div>
    </div>

    <a class="btn" href="StudentHealth.html">پرداخت با درگاه بانکی</a>
    <p class="muted" style="text-align: center">بعد از پرداخت، چند سوال کوتاه درباره‌ی سلامتت می‌پرسیم تا مربی حرکت مناسب تو را نشان دهد.</p>
  </div>
</div>
</body>
</html>
