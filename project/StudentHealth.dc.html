<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>پرسشنامه‌ی سلامت</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1f5f8b}a:hover{color:#174a6c}
.scr{width:390px;height:844px;box-sizing:border-box;background:#f3f4f5;font-family:Vazirmatn,Tahoma,sans-serif;color:#1d2125;direction:rtl;display:flex;flex-direction:column;overflow:hidden}
.top{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;background:#fff;border-bottom:1px solid #d4d7db}
.top h1{margin:0;font-size:17px;font-weight:700}
.body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.card{background:#fff;border:1px solid #d4d7db;border-radius:12px;padding:6px 14px;display:flex;flex-direction:column}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 16px;border-radius:10px;background:#1d2125;color:#fff;text-decoration:none;font-weight:700;font-size:16px;border:0;font-family:inherit;cursor:pointer;flex-shrink:0}
.btn:hover{color:#fff;background:#3a4047}
.muted{color:#5b6167;font-size:13px;margin:0;line-height:1.7}
.ck{display:flex;align-items:center;gap:12px;min-height:46px;font-size:15px;border-top:1px solid #e4e6e9;cursor:pointer}
.ck:first-child{border-top:0}
.ck input{width:20px;height:20px;margin:0;accent-color:#1d2125;flex-shrink:0}
.steps{display:flex;gap:6px}
.steps i{flex:1;height:4px;border-radius:99px;background:#1d2125;display:block}
.steps i.n{background:#d4d7db}
textarea{border:1px solid #b4b9bf;border-radius:8px;padding:10px 12px;font-family:inherit;font-size:14px;background:#fff;min-height:64px;resize:none;box-sizing:border-box;width:100%}
</style>
</helmet>
<div class="scr">
  <div class="top">
    <h1>قبل از شروع</h1>
    <span class="muted">مرحله‌ی ۱ از ۲</span>
  </div>
  <div class="body">
    <div class="steps" aria-hidden="true"><i></i><i class="n"></i></div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 18px; font-weight: 700">کدام‌یک درباره‌ی تو صدق می‌کند؟</span>
      <p class="muted">این را فقط مربی‌ات می‌بیند تا برای حرکت‌های حساس، نسخه‌ی مناسب تو را نشان دهیم.</p>
    </div>
    <div class="card">
      <label class="ck"><input type="checkbox">باردار هستم</label>
      <label class="ck"><input type="checkbox">دیسک یا کمردرد</label>
      <label class="ck"><input type="checkbox">فشار خون بالا</label>
      <label class="ck"><input type="checkbox">جراحی در شش ماه اخیر</label>
      <label class="ck"><input type="checkbox">مشکل زانو</label>
      <label class="ck"><input type="checkbox">مشکل شانه یا گردن</label>
      <label class="ck"><input type="checkbox">سرگیجه</label>
      <label class="ck"><input type="checkbox">هیچ‌کدام</label>
    </div>
    <label for="h-more" style="font-size: 13px; color: #3c4043; font-weight: 500">توضیح بیشتر (اختیاری)</label>
    <textarea id="h-more" placeholder="مثلاً: دیسک L4، پزشک گفته خم شدن به جلو ممنوع"></textarea>
    <p class="muted">این پرسشنامه جای مشورت با پزشک را نمی‌گیرد.</p>
    <a class="btn" href="StudentSchedule.dc.html">ادامه</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
